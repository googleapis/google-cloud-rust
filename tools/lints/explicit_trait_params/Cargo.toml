[package]
name        = "explicit_trait_params"
version     = "0.1.0"
description = "Requires calls to configured trait methods to spell out the trait's generic parameters"
edition     = "2024"
publish     = false

[lib]
crate-type = ["cdylib"]

[dependencies]
dylint_linting = "6.0"
serde          = { version = "1", features = ["derive"] }

[dev-dependencies]
dylint_testing = "6.0"

[package.metadata.rust-analyzer]
rustc_private = true

# Keep this package out of the main google-cloud-rust workspace: it builds
# against a pinned nightly with `rustc_private`.
[workspace]
