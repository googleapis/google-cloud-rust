[package]
description       = "Integration tests for Bigtable."
name              = "integration-tests-bigtable"
publish           = false
version           = "0.0.0"
edition.workspace = true
license.workspace = true

[dev-dependencies]
anyhow.workspace               = true
google-cloud-bigtable-admin-v2 = { workspace = true, features = ["default"] }
