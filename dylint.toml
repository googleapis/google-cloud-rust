# Configuration for the custom lints in `tools/lints`.

# Calls to these traits' methods must spell out the trait's generic parameters,
# e.g. `ToProto::<P>::to_proto(x)` instead of `x.to_proto()`, but only where a
# future impl in another crate could make the call ambiguous: calls outside the
# trait's defining crate whose receiver type is neither a generic parameter nor
# a type defined in the calling crate. Blanket impls of these traits are also
# flagged.
#
# Only list traits that cannot be sealed (other crates implement them) and that
# take a trait-level generic parameter, so one type can have several impls in
# independently released crates.
[explicit_trait_params]
traits = ["google_cloud_gax_internal::prost::FromProto", "google_cloud_gax_internal::prost::ToProto"]
