[package]
name                 = "bigquery-benchmark-queries"
version              = "0.0.0"
publish              = false
edition.workspace    = true
authors.workspace    = true
license.workspace    = true
repository.workspace = true
keywords.workspace   = true
categories.workspace = true

[dependencies]
anyhow.workspace                 = true
clap                             = { workspace = true, features = ["derive", "env", "help", "std", "usage"] }
futures.workspace                = true
google-cloud-auth.workspace      = true
google-cloud-bigquery            = { workspace = true, features = ["default-rustls-provider"] }
google-cloud-bigquery-v2.workspace = true
google-cloud-gax.workspace       = true
humantime.workspace              = true
integration-tests-o11y.workspace = true
opentelemetry                    = { workspace = true, features = ["trace", "metrics"] }
opentelemetry_sdk                = { workspace = true, features = ["rt-tokio", "trace", "metrics"] }
rand.workspace                   = true
serde                            = { workspace = true, features = ["derive"] }
serde_json.workspace             = true
tokio                            = { workspace = true, features = ["macros", "rt-multi-thread", "time", "sync", "signal"] }
tokio-metrics                    = { workspace = true, features = ["rt"] }
tracing.workspace                = true
tracing-log                      = { workspace = true, features = ["log-tracer", "std"] }
tracing-subscriber               = { workspace = true, features = ["env-filter", "fmt", "std"] }
uuid.workspace                   = true

[lints]
workspace = true
