[package]
name                   = "storage-grpc-uds"
description            = "Google Cloud Storage Rust core exposed as a gRPC server over a Unix Domain Socket (UDS)"
version                = "0.0.0"
build                  = "build.rs"
publish                = false
edition.workspace      = true
authors.workspace      = true
license.workspace      = true
repository.workspace   = true
keywords.workspace     = true
categories.workspace   = true
rust-version.workspace = true

[lib]
name       = "storage_grpc_uds"
path       = "src/lib.rs"
crate-type = ["rlib", "staticlib", "cdylib"]

[[bin]]
name = "gcs-core-server"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
bytes.workspace              = true
clap                         = { workspace = true, features = ["derive", "help", "std", "usage"] }
crc32c.workspace             = true
google-cloud-auth.workspace  = true
google-cloud-gax.workspace   = true
google-cloud-storage         = { workspace = true, features = ["default-rustls-provider"] }
google-cloud-wkt.workspace   = true
http.workspace               = true
libc                         = { workspace = true, default-features = true }
prost                        = { workspace = true, default-features = true }
serde_json.workspace         = true
tokio                        = { workspace = true, features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream                 = { workspace = true, features = ["net"] }
tonic                        = { workspace = true, features = ["codegen", "router", "server", "transport"] }
tonic-prost.workspace        = true
tracing.workspace            = true
tracing-subscriber           = { workspace = true, features = ["env-filter", "fmt", "std"] }

[build-dependencies]
tonic-prost-build = { workspace = true }

[dev-dependencies]
anyhow.workspace            = true
httptest.workspace          = true
hyper-util                  = { workspace = true, features = ["tokio"] }
prost-types                 = { workspace = true, default-features = true }
serde_json.workspace        = true
storage-grpc-mock.workspace = true
tempfile.workspace          = true
tokio                       = { workspace = true, features = ["test-util"] }
tower.workspace             = true
